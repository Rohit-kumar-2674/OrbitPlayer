name: Build OrbitPlayer APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'OrbitPlayer-open-source.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android project
        shell: bash
        run: |
          if [ -f OrbitPlayer-open-source.zip ]; then
            mkdir -p unpacked
            unzip -q OrbitPlayer-open-source.zip -d unpacked
            cp -a unpacked/OrbitPlayer/. .
          fi
          test -f app/build.gradle || { echo "Upload OrbitPlayer-open-source.zip to the repository first"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrbitPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
